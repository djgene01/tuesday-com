name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The web host applies EF Core migrations at start-up, so the integration tests need a
    # real PostgreSQL. Redis is included because /health/ready probes it. Ports match the
    # development configuration the test host loads (127.0.0.1:5433 and :6379).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tuesday
          POSTGRES_USER: tuesday
          POSTGRES_PASSWORD: tuesday_dev_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U tuesday -d tuesday"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Verify Tailwind CSS is up to date
        run: |
          npm ci --no-audit --no-fund
          npm run css
          git diff --exit-code -- src/Tuesday.Web/wwwroot/css/tailwind.css

      - name: Restore
        run: dotnet restore Tuesday.slnx

      - name: Build (warnings are errors)
        run: dotnet build Tuesday.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Tuesday.slnx --configuration Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Clean-room scan
        run: bash scripts/clean-room/scan.sh

      - name: SBOM and reviewed dependency allowlist
        run: python3 scripts/sbom/generate.py --check

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: artifacts/sbom.cdx.json

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  dependency-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Tuesday.slnx

      - name: Known-vulnerable packages
        run: dotnet list Tuesday.slnx package --vulnerable --include-transitive

      - name: Deprecated packages
        run: dotnet list Tuesday.slnx package --deprecated

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
