# Reverse proxy for the two-replica stack.
#
# ip_hash keeps one browser on one replica. SignalR's WebSocket lives on one connection for the
# life of the circuit, so affinity is required; without it the negotiate request can land on the
# other replica and the upgrade fails. This is deliberately the simplest form that works.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream tuesday {
    ip_hash;
    server app-a:8080 max_fails=2 fail_timeout=10s;
    server app-b:8080 max_fails=2 fail_timeout=10s;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 50m;

    # Long timeouts: a Blazor circuit is a long-lived WebSocket, not a request/response pair.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        proxy_pass http://tuesday;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
