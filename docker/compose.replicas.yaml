# Two web replicas behind nginx — the multi-instance shape P6-5 requires.
#
#   docker compose -f docker/compose.replicas.yaml up -d --build
#   open http://127.0.0.1:8081
#
# The two app instances share the PostgreSQL database (including the Data Protection key ring),
# the Redis cache and one attachments volume. Replica ports 5201/5202 are published on loopback
# so a test can address an instance directly and prove a session crosses replicas.
#
# ASPNETCORE_ENVIRONMENT is Development on purpose here: the seeder creates the demo accounts so
# the rehearsal can sign in. A real deployment runs Production and creates the first
# administrator out of band.

name: tuesday-replicas

x-web: &web
  build:
    context: ..
    dockerfile: Dockerfile
  image: tuesday-web:${TUESDAY_TAG:-0.9.1}
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  environment:
    ASPNETCORE_ENVIRONMENT: Development
    ASPNETCORE_URLS: http://0.0.0.0:8080
    ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-tuesday};Username=${POSTGRES_USER:-tuesday};Password=${POSTGRES_PASSWORD:-tuesday_dev_password};Timeout=10"
    Redis__Configuration: "redis:6379,abortConnect=false"
    Storage__Root: /var/tuesday/files
    Email__Enabled: "false"
  volumes:
    - app-files:/var/tuesday/files
  healthcheck:
    test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
    interval: 10s
    timeout: 3s
    retries: 10
    start_period: 30s

services:
  app-a:
    <<: *web
    ports:
      - "127.0.0.1:5201:8080"

  app-b:
    <<: *web
    ports:
      - "127.0.0.1:5202:8080"

  proxy:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      - app-a
      - app-b
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./nginx/tuesday.conf:/etc/nginx/conf.d/default.conf:ro

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    command:
      - -c
      - timezone=UTC
      - -c
      - max_connections=200
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tuesday}
      POSTGRES_USER: ${POSTGRES_USER:-tuesday}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tuesday_dev_password}
      TZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-tuesday} -d ${POSTGRES_DB:-tuesday}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  app-files:
